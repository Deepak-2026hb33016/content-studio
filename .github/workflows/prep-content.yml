name: Prepare Content Drafts

on:
  schedule:
    - cron: "30 2 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Gemini SDK
        run: pip install --quiet google-genai pydantic

      - name: Generate drafts for upcoming posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/prepare_drafts.py

      - name: Build companion site feed
        run: python scripts/build_site_feed.py

      - name: Commit generated drafts and feed
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add queue/posts.json drafts/ site-data/
          if ! git diff --staged --quiet; then
            git commit -m "chore: generate drafts and update companion feed"
            git pull --rebase origin main
            git push
          fi
